<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Mohamed Khaled Shoaib - Backend Software Engineer">
  <title>Mohamed Khaled Shoaib &#8212; Backend Software Engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBFCFF"/>
      <stop offset="55%" stop-color="#E9EEFB"/>
      <stop offset="100%" stop-color="#F5F7FE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3355E8"/>
      <stop offset="50%" stop-color="#0E9E72"/>
      <stop offset="100%" stop-color="#C2701A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#3355E8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3355E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0E9E72" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0E9E72" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .f { font-family: 'Segoe UI', Inter, system-ui, Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, monospace; }
      .name { fill:#0C1430; font-size:57px; font-weight:700; letter-spacing:-0.6px; }
      .eyebrow { fill:#0E9E72; font-size:14px; font-weight:600; letter-spacing:4.4px; }
      .rot { fill:#22305A; font-size:20.5px; font-weight:500; opacity:0;
              animation: cyc 13.2s ease-in-out infinite; }
      .meta { fill:#5A688F; font-size:14.5px; letter-spacing:0.4px; }
      .chip { fill:#FFFFFF; stroke:#D3DCF0; stroke-width:1; }
      .chipt { fill:#5A688F; font-size:12.5px; font-weight:600; letter-spacing:0.8px; }
      .grid line { stroke:#41527E; stroke-width:1; stroke-opacity:0.12; }
      .drift { animation: drift 9s linear infinite; }
      .spoke { stroke:url(#accent); stroke-width:2; stroke-opacity:.8;
                stroke-dasharray:6 10; animation: flow 2.6s linear infinite; }
      .node { fill:#3355E8; animation: pulse 2.6s ease-in-out infinite; }
      .hub { fill:none; stroke:#0E9E72; stroke-width:2; }
      .halo { fill:none; stroke:#0E9E72; stroke-width:1.4; stroke-opacity:.45;
               animation: halo 3.4s ease-out infinite; transform-origin:1012.0px 170.0px; }
      .sweep { animation: sweep 5.5s ease-in-out infinite; }
      .orb { animation: breathe 7s ease-in-out infinite; }
      @keyframes cyc {
        0%   { opacity:0; transform: translateY(9px); }
        3.5% { opacity:1; transform: translateY(0); }
        21%  { opacity:1; transform: translateY(0); }
        25%  { opacity:0; transform: translateY(-9px); }
        100% { opacity:0; transform: translateY(-9px); }
      }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(40px); } }
      @keyframes flow { to { stroke-dashoffset:-32; } }
      @keyframes pulse { 0%,100% { opacity:.45; r:6; } 50% { opacity:1; r:8; } }
      @keyframes halo { 0% { transform:scale(.55); opacity:.7; } 100% { transform:scale(1.7); opacity:0; } }
      @keyframes sweep { 0%,100% { opacity:.35; } 50% { opacity:1; } }
      @keyframes breathe { 0%,100% { opacity:.65; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) {
        .rot, .drift, .spoke, .node, .halo, .sweep, .orb { animation:none; }
        .rot { opacity:0; }
        .rot:first-of-type { opacity:1; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g class="grid drift"><line x1="0" y1="0" x2="0" y2="340"/><line x1="40" y1="0" x2="40" y2="340"/><line x1="80" y1="0" x2="80" y2="340"/><line x1="120" y1="0" x2="120" y2="340"/><line x1="160" y1="0" x2="160" y2="340"/><line x1="200" y1="0" x2="200" y2="340"/><line x1="240" y1="0" x2="240" y2="340"/><line x1="280" y1="0" x2="280" y2="340"/><line x1="320" y1="0" x2="320" y2="340"/><line x1="360" y1="0" x2="360" y2="340"/><line x1="400" y1="0" x2="400" y2="340"/><line x1="440" y1="0" x2="440" y2="340"/><line x1="480" y1="0" x2="480" y2="340"/><line x1="520" y1="0" x2="520" y2="340"/><line x1="560" y1="0" x2="560" y2="340"/><line x1="600" y1="0" x2="600" y2="340"/><line x1="640" y1="0" x2="640" y2="340"/><line x1="680" y1="0" x2="680" y2="340"/><line x1="720" y1="0" x2="720" y2="340"/><line x1="760" y1="0" x2="760" y2="340"/><line x1="800" y1="0" x2="800" y2="340"/><line x1="840" y1="0" x2="840" y2="340"/><line x1="880" y1="0" x2="880" y2="340"/><line x1="920" y1="0" x2="920" y2="340"/><line x1="960" y1="0" x2="960" y2="340"/><line x1="1000" y1="0" x2="1000" y2="340"/><line x1="1040" y1="0" x2="1040" y2="340"/><line x1="1080" y1="0" x2="1080" y2="340"/><line x1="1120" y1="0" x2="1120" y2="340"/><line x1="1160" y1="0" x2="1160" y2="340"/><line x1="1200" y1="0" x2="1200" y2="340"/><line x1="1240" y1="0" x2="1240" y2="340"/><line x1="-40" y1="0" x2="1240" y2="0"/><line x1="-40" y1="40" x2="1240" y2="40"/><line x1="-40" y1="80" x2="1240" y2="80"/><line x1="-40" y1="120" x2="1240" y2="120"/><line x1="-40" y1="160" x2="1240" y2="160"/><line x1="-40" y1="200" x2="1240" y2="200"/><line x1="-40" y1="240" x2="1240" y2="240"/><line x1="-40" y1="280" x2="1240" y2="280"/><line x1="-40" y1="320" x2="1240" y2="320"/><line x1="-40" y1="360" x2="1240" y2="360"/></g>
    <ellipse class="orb" cx="130" cy="60" rx="330" ry="210" fill="url(#glowA)"/>
    <ellipse class="orb" cx="1010" cy="280" rx="300" ry="200" fill="url(#glowB)" style="animation-delay:2.5s"/>

    <g filter="url(#soft)">
      <line class="spoke" x1="1012.0" y1="170.0" x2="1012.0" y2="96.0" style="animation-delay:0.00s"/><line class="spoke" x1="1012.0" y1="170.0" x2="1076.1" y2="133.0" style="animation-delay:0.45s"/><line class="spoke" x1="1012.0" y1="170.0" x2="1076.1" y2="207.0" style="animation-delay:0.90s"/><line class="spoke" x1="1012.0" y1="170.0" x2="1012.0" y2="244.0" style="animation-delay:1.35s"/><line class="spoke" x1="1012.0" y1="170.0" x2="947.9" y2="207.0" style="animation-delay:1.80s"/><line class="spoke" x1="1012.0" y1="170.0" x2="947.9" y2="133.0" style="animation-delay:2.25s"/><circle class="node" cx="1012.0" cy="96.0" r="7" style="animation-delay:0.00s"/><circle class="node" cx="1076.1" cy="133.0" r="7" style="animation-delay:0.45s"/><circle class="node" cx="1076.1" cy="207.0" r="7" style="animation-delay:0.90s"/><circle class="node" cx="1012.0" cy="244.0" r="7" style="animation-delay:1.35s"/><circle class="node" cx="947.9" cy="207.0" r="7" style="animation-delay:1.80s"/><circle class="node" cx="947.9" cy="133.0" r="7" style="animation-delay:2.25s"/>
      <circle class="halo" cx="1012.0" cy="170.0" r="30"/>
      <circle class="hub" cx="1012.0" cy="170.0" r="21"/>
      <circle cx="1012.0" cy="170.0" r="9" fill="#0E9E72"/>
    </g>

    <rect x="74" y="72" width="34" height="3" rx="1.5" fill="url(#accent)" class="sweep"/>
    <text class="f eyebrow" x="120" y="79">BACKEND SOFTWARE ENGINEER</text>
    <text class="f name" x="70" y="152">Mohamed Khaled Shoaib</text>
    <text class="m" x="74" y="228" font-size="20.5" fill="#C2701A" opacity=".9">&#9656;</text>
    <g transform="translate(24,0)">
      <text class="f rot" x="74" y="228" style="animation-delay:0.00s">Python  ·  Frappe Framework  ·  ERPNext</text>
      <text class="f rot" x="74" y="228" style="animation-delay:3.30s">Multi-Tenant SaaS  ·  Stripe Billing  ·  Entitlements</text>
      <text class="f rot" x="74" y="228" style="animation-delay:6.60s">E-Invoicing Compliance  ·  ETA Egypt  ·  ZATCA KSA</text>
      <text class="f rot" x="74" y="228" style="animation-delay:9.90s">REST APIs  ·  React  ·  MariaDB  ·  PostgreSQL</text>
    </g>
    <text class="f meta" x="74" y="272">Giza, Egypt   &#183;   3+ years shipping production Python   &#183;   Open to remote</text>

    <g transform="translate(772,296)">
      <rect class="chip" x="0" y="0" width="96" height="26" rx="13"/><text class="m chipt" x="48" y="17" text-anchor="middle">PYTHON</text>
      <rect class="chip" x="106" y="0" width="90" height="26" rx="13"/><text class="m chipt" x="151" y="17" text-anchor="middle">FRAPPE</text>
      <rect class="chip" x="206" y="0" width="100" height="26" rx="13"/><text class="m chipt" x="256" y="17" text-anchor="middle">ERPNEXT</text>
      <rect class="chip" x="316" y="0" width="86" height="26" rx="13"/><text class="m chipt" x="359" y="17" text-anchor="middle">SAAS</text>
    </g>

    <rect x="0" y="336" width="1200" height="4" fill="url(#accent)" class="sweep"/>
    <rect width="1200" height="340" rx="18" fill="none" stroke="#C9D3EC" stroke-width="1.5"/>
  </g>
</svg>
