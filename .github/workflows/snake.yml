name: Contribution snake

# Redraws the contribution grid as a snake animation and publishes it to the
# `output` branch, which the README points at. Colours match the hero banner
# rather than the action's default green.

on:
  schedule:
    - cron: "17 3 * * *"      # daily, a little off the hour to dodge the rush
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2335D6A4&color_dots=%23111A2E,%231E2E55,%233A5BD9,%236C8CFF,%23A9BEFF
            dist/snake-light.svg?palette=github-light&color_snake=%230E9E72&color_dots=%23EEF1F8,%23C9D5F5,%238EA6EE,%235D7EE6,%233355E8

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
